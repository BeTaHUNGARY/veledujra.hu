<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Veled Újra</title>
</head>
<body>

  <h1>Élő Közös Weboldal</h1>

  <!-- ÉLŐ PIPA -->
  <label style="font-size: 20px;">
    <input type="checkbox" id="sharedCheckbox">
    Közös pipálandó feladat
  </label>

  <br><br>

  <!-- ÉLŐ SZÖVEGDOBOZ -->
  <label style="font-size: 20px;">
    Közös üzenet / megjegyzés:<br>
    <input type="text" id="sharedTextInput" placeholder="Írj ide valamit..." style="font-size: 16px; padding: 5px;">
  </label>

  <!-- FIREBASE BETÖLTÉSE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // A te projekted adatai
    const firebaseConfig = {
      projectId: "veledujra-67cbf"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Az adatbázis 'oldal' nevű gyűjteményének 'allapot' nevű dokumentuma
    const docRef = doc(db, "oldal", "allapot");

    const checkbox = document.getElementById("sharedCheckbox");
    const textInput = document.getElementById("sharedTextInput");

    // 1. ÉLŐ FIGYELÉS: Amikor az adatbázisban változik valami, frissíti a képernyőt
    onSnapshot(docRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.isPiped !== undefined) checkbox.checked = data.isPiped;
        if (data.szoveg !== undefined && document.activeElement !== textInput) {
          textInput.value = data.szoveg;
        }
      }
    });

    // 2. KÜLDÉS: Ha valaki átpipálja a dobozt
    checkbox.addEventListener("change", () => {
      setDoc(docRef, { isPiped: checkbox.checked }, { merge: true });
    });

    // 3. KÜLDÉS: Ha valaki beír egy szöveget
    textInput.addEventListener("input", () => {
      setDoc(docRef, { szoveg: textInput.value }, { merge: true });
    });
  </script>

</body>
</html>
