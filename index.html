<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pálma és Tomi</title>
    <!-- FontAwesome Ikonok -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0c1b;
            --card-bg: #18132a;
            --card-inner: #221b3a;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; overflow-x: hidden; }

        /* INTRO ANIMÁCIÓ */
        #intro-overlay {
            position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .heart-svg { width: 180px; height: 180px; }
        .heart-path {
            fill: none; stroke: var(--accent-pink); stroke-width: 4;
            stroke-dasharray: 500; stroke-dashoffset: 500;
            animation: drawHeart 2.5s ease-in-out forwards;
        }
        .intro-text {
            font-size: 3rem; font-weight: 700; color: var(--text-light);
            margin-top: -110px; margin-bottom: 80px;
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
        }
        @keyframes drawHeart { to { stroke-dashoffset: 0; } }

        /* LGIN / DÁTUM KAPU */
        #login-screen {
            display: none; position: fixed; inset: 0; background: var(--bg-dark);
            z-index: 8888; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        }
        .login-box {
            background: var(--card-bg); padding: 40px; border-radius: 20px;
            border: 1px solid rgba(139, 92, 246, 0.2); text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 400px; width: 90%;
        }
        .login-box h2 { margin-bottom: 15px; color: var(--accent-pink); }
        .date-input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--accent-purple);
            background: var(--card-inner); color: #fff; font-size: 1.1rem; text-align: center; margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: #fff; border: none; padding: 12px 30px; border-radius: 10px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(236, 72, 153, 0.4); }

        /* PIPÁLÁS SIKER ANIMÁCIÓ */
        .check-anim {
            display: none; font-size: 4rem; color: #10b981; animation: popIn 0.5s ease;
        }
        @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* FŐOLDAL KINÉZET */
        #main-app { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px;
        }
        .logo-container { position: relative; padding: 10px 20px; }
        .logo-text { font-size: 1.5rem; font-weight: 700; color: #fff; position: relative; z-index: 2; }
        .neon-heart-border {
            position: absolute; inset: 0; border: 2px solid var(--accent-pink);
            border-radius: 30px; box-shadow: 0 0 10px var(--accent-pink);
            animation: pulseNeon 2s infinite alternate;
        }
        @keyframes pulseNeon { from { opacity: 0.4; box-shadow: 0 0 5px var(--accent-pink); } to { opacity: 1; box-shadow: 0 0 15px var(--accent-pink); } }

        .top-counter {
            font-size: 1.4rem; font-weight: 600; background: var(--card-bg);
            padding: 10px 25px; border-radius: 30px; border: 1px solid var(--accent-purple);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        .user-selector { display: flex; gap: 10px; align-items: center; }
        .user-btn {
            background: var(--card-inner); border: 1px solid var(--accent-purple);
            color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer;
        }
        .user-btn.active { background: var(--accent-purple); font-weight: bold; }

        /* PROFIL STATISZTIKA */
        .stats-bar {
            display: flex; gap: 20px; justify-content: center; margin-bottom: 25px;
            background: var(--card-bg); padding: 15px; border-radius: 15px;
        }
        .stat-item { font-size: 1.1rem; }

        /* NAPTÁR FELSŐ LÉPTETŐ */
        .calendar-controls {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .nav-btn {
            background: var(--card-bg); border: 1px solid var(--accent-purple); color: #fff;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem;
        }

        /* HETI NAPTÁR GRID */
        .week-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; margin-bottom: 30px;
        }
        @media(max-width: 1024px) { .week-grid { grid-template-columns: 1fr; } }

        .day-card {
            background: var(--card-bg); border-radius: 16px; padding: 15px;
            border: 1px solid rgba(255,255,255,0.05); min-height: 250px;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: 0.3s; position: relative;
        }
        .day-card.completed { border-color: #10b981; background: #122420; }
        .day-header { font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; }
        
        .notes-list { flex-grow: 1; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .note-bubble {
            background: var(--card-inner); padding: 8px 10px; border-radius: 8px;
            font-size: 0.85rem; word-break: break-word; border-left: 3px solid var(--accent-pink);
        }

        .check-btn {
            width: 100%; padding: 10px; border-radius: 10px; border: none;
            background: var(--card-inner); color: #fff; cursor: pointer;
            font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .day-card.completed .check-btn { background: #10b981; }

        .add-note-btn {
            background: none; border: 1px dashed var(--text-muted); color: var(--text-muted);
            width: 100%; padding: 5px; border-radius: 6px; cursor: pointer; margin-bottom: 10px;
        }
        .add-note-btn:hover { border-color: var(--accent-pink); color: var(--accent-pink); }

        /* DÍNO DEKORÁCIÓK */
        .dino-icon { position: fixed; bottom: 20px; right: 20px; font-size: 3rem; opacity: 0.8; pointer-events: none; }
        .dino-left { position: fixed; bottom: 20px; left: 20px; font-size: 2.5rem; opacity: 0.8; pointer-events: none; }

        /* HÓNAP NÉZET MODAL */
        #month-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 7777; align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 20px;
            max-width: 800px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
        .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 20px; }
        .month-day-cell {
            background: var(--card-inner); padding: 10px; border-radius: 8px; text-align: center; font-size: 0.9rem;
        }
        .month-day-cell.done { background: #10b981; color: #fff; }
    </style>
</head>
<body>

    <!-- 1. INTRO ANIMÁCIÓ -->
    <div id="intro-overlay">
        <svg class="heart-svg" viewBox="0 0 32 32">
            <path class="heart-path" d="M16,28.2 C16,28.2 3,21.2 3,11.5 C3,6.8 6.8,3 11.5,3 C14.1,3 16,4.5 16,4.5 C16,4.5 17.9,3 20.5,3 C25.2,3 29,6.8 29,11.5 C29,21.2 16,28.2 16,28.2 Z"/>
        </svg>
        <div class="intro-text">P & T</div>
    </div>

    <!-- 2. BELÉPTETŐ KÉPERNYŐ -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Mikor kezdődött? ❤️</h2>
            <p style="color: var(--text-muted); margin-bottom: 15px;">Válaszd ki a dátumot a belépéshez!</p>
            <input type="date" id="login-date" class="date-input" value="2022-10-26">
            <br>
            <button class="btn" onclick="checkLogin()">Belépés</button>
            <div id="login-check-anim" class="check-anim" style="margin-top: 15px;">
                <i class="fa-solid fa-circle-check"></i>
            </div>
        </div>
    </div>

    <!-- 3. FŐ ALKALMAZÁS -->
    <div id="main-app">
        <header>
            <div class="logo-container">
                <div class="neon-heart-border"></div>
                <div class="logo-text">Pálma és Tomi</div>
            </div>

            <div class="top-counter" id="main-countdown">
                365 napból 365 maradt
            </div>

            <div class="user-selector">
                <span style="font-size: 0.9rem; color: var(--text-muted);">Ki vagy most?</span>
                <button class="user-btn active" id="btn-tomi" onclick="setUser('Tomi')">Tomi 🦖</button>
                <button class="user-btn" id="btn-palma" onclick="setUser('Pálma')">Pálma 🦕</button>
            </div>
        </header>

        <!-- KÜLÖN RANGSORMÉRŐ -->
        <div class="stats-bar">
            <div class="stat-item">🦖 <b>Tomi:</b> <span id="stat-tomi">0</span> napot pipált ki</div>
            <div class="stat-item" style="border-left: 1px solid rgba(255,255,255,0.1); padding-left: 20px;">🦕 <b>Pálma:</b> <span id="stat-palma">0</span> napot pipált ki</div>
        </div>

        <!-- HETI NAPTÁR IRÁNYÍTÓ -->
        <div class="calendar-controls">
            <button class="nav-btn" onclick="changeWeek(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <h2 id="week-title" style="font-size: 1.3rem;">2026. Augusztus 24 - 30.</h2>
            <div>
                <button class="btn" style="padding: 8px 15px; margin-right: 10px;" onclick="openMonthModal()">Hónap nézet</button>
                <button class="nav-btn" onclick="changeWeek(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- HETI NAPTÁR GRID -->
        <div class="week-grid" id="week-container">
            <!-- A JavaScript fogja felépíteni a napokat -->
        </div>
    </div>

    <!-- HÓNAP MODAL -->
    <div id="month-modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 id="month-modal-title">Egész hónap</h2>
                <button class="nav-btn" onclick="closeMonthModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="month-grid" id="month-grid-container"></div>
        </div>
    </div>

    <!-- DÍNOK A SAROKBAN -->
    <div class="dino-icon">🦖</div>
    <div class="dino-left">🦕</div>

    <!-- FIREBASE SDK-k -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // 1. FIREBASE BEÁLLÍTÁS A TE ADATAIDDAL
        const firebaseConfig = {
            apiKey: "AIzaSyC8X20G2wTZPx17VywN09I-LDpoi_x7rg4",
            authDomain: "veledujra-67cbf.firebaseapp.com",
            databaseURL: "https://veledujra-67cbf-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "veledujra-67cbf",
            storageBucket: "veledujra-67cbf.firebasestorage.app",
            messagingSenderId: "876403991342",
            appId: "1:876403991342:web:b4555cad750fe2be5490bf"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // VALTOZOK
        let currentUser = 'Tomi';
        let currentWeekStart = new Date("2026-08-24"); // A pipálás első napjának hete
        let completedDaysData = {};
        let notesData = {};

        const cuteMessages = [
            "Ezaz! Máris egyel kevesebb! 🥰",
            "Még egy nap kipipálva, szuper vagy! 💖",
            "Egyre közelebb a célhoz! 🦖🦕",
            "Újabb közös mérföldkő! ✨",
            "Imádom, hogy haladunk! ❤️"
        ];

        // INTRO ANIMÁCIÓ INDÍTÁSA
        setTimeout(() => {
            document.getElementById('intro-overlay').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }, 2800);

        // LOGIN ELLENŐRZÉS
        function checkLogin() {
            const val = document.getElementById('login-date').value;
            if (val === "2022-10-26") {
                const anim = document.getElementById('login-check-anim');
                anim.style.display = 'block';
                setTimeout(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    initApp();
                }, 1000);
            } else {
                alert("Helytelen dátum! Próbáld újra ❤️");
            }
        }

        function setUser(user) {
            currentUser = user;
            document.getElementById('btn-tomi').classList.toggle('active', user === 'Tomi');
            document.getElementById('btn-palma').classList.toggle('active', user === 'Pálma');
        }

        function initApp() {
            // REALTIME ADATBÁZIS FIGYELÉSE
            db.ref('completed_days').on('value', (snapshot) => {
                completedDaysData = snapshot.val() || {};
                renderWeek();
                updateCounterAndStats();
            });

            db.ref('notes').on('value', (snapshot) => {
                notesData = snapshot.val() || {};
                renderWeek();
            });
        }

        // HETI NAPTÁR RENDERELÉSE
        function renderWeek() {
            const container = document.getElementById('week-container');
            container.innerHTML = '';

            const dayNames = ['Hétfő', 'Kedd', 'Szerda', 'Csütörtök', 'Péntek', 'Szombat', 'Vasárnap'];
            
            // Hét címsor
            const endWeek = new Date(currentWeekStart);
            endWeek.setDate(endWeek.getDate() + 6);
            document.getElementById('week-title').innerText = 
                `${currentWeekStart.getFullYear()}. ${currentWeekStart.getMonth()+1}.${currentWeekStart.getDate()} - ${endWeek.getMonth()+1}.${endWeek.getDate()}.`;

            for (let i = 0; i < 7; i++) {
                const d = new Date(currentWeekStart);
                d.setDate(d.getDate() + i);
                const dateKey = d.toISOString().split('T')[0]; // YYYY-MM-DD
                
                const isChecked = !!completedDaysData[dateKey];
                const checkedBy = isChecked ? completedDaysData[dateKey].by : '';

                // Kártya HTML
                const card = document.createElement('div');
                card.className = `day-card ${isChecked ? 'completed' : ''}`;
                
                let notesHtml = '';
                if (notesData[dateKey]) {
                    Object.keys(notesData[dateKey]).forEach(noteId => {
                        const note = notesData[dateKey][noteId];
                        notesHtml += `<div class="note-bubble"><b>${note.by}:</b> ${note.text}</div>`;
                    });
                }

                card.innerHTML = `
                    <div>
                        <div class="day-header">
                            <span>${dayNames[i]}</span>
                            <span style="color:var(--text-muted); font-size:0.9rem;">${d.getMonth()+1}.${d.getDate()}</span>
                        </div>
                        <button class="add-note-btn" onclick="addNote('${dateKey}')">+ Megjegyzés</button>
                        <div class="notes-list">${notesHtml}</div>
                    </div>
                    <div>
                        ${isChecked ? `<p style="font-size:0.75rem; color:#10b981; margin-bottom:5px; text-align:center;">Kipipálta: ${checkedBy}</p>` : ''}
                        <button class="check-btn" onclick="toggleDay('${dateKey}', ${isChecked})">
                            <i class="fa-solid ${isChecked ? 'fa-circle-check' : 'fa-circle'}"></i>
                            ${isChecked ? 'Kipipálva' : 'Kipipálás'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        // PIPA KAPCSOLÁSA (VISSZAVONÁSNÁL RÁKÉRDEZÉSSEL)
        function toggleDay(dateKey, isChecked) {
            // Ellenőrzés: 2026. augusztus 24 előtt nem pipálható
            if (dateKey < "2026-08-24") {
                alert("A 365 napot csak 2026. augusztus 24-től lehet pipálni!");
                return;
            }

            if (isChecked) {
                // Visszavonási megerősítés
                if (confirm("Biztosan vissza szeretnéd vonni ezt a pipát?")) {
                    db.ref(`completed_days/${dateKey}`).remove();
                }
            } else {
                // Pipálás + Cuki üzenet
                const randomMsg = cuteMessages[Math.floor(Math.random() * cuteMessages.length)];
                db.ref(`completed_days/${dateKey}`).set({
                    by: currentUser,
                    timestamp: Date.now()
                });
                alert(randomMsg);
            }
        }

        // MEGJEGYZÉS HOZZÁADÁSA
        function addNote(dateKey) {
            const text = prompt("Írj egy megjegyzést ehhez a naphoz:");
            if (text && text.trim() !== "") {
                db.ref(`notes/${dateKey}`).push({
                    by: currentUser,
                    text: text.trim()
                });
            }
        }

        // LÉPTETÉS
        function changeWeek(direction) {
            currentWeekStart.setDate(currentWeekStart.getDate() + (direction * 7));
            renderWeek();
        }

        // SZÁMLÁLÓ ÉS STATISZTIKA FRISSÍTÉSE
        function updateCounterAndStats() {
            const totalChecked = Object.keys(completedDaysData).length;
            const remaining = Math.max(0, 365 - totalChecked);
            document.getElementById('main-countdown').innerText = `365 napból ${remaining} maradt`;

            let tomiCount = 0;
            let palmaCount = 0;

            Object.values(completedDaysData).forEach(item => {
                if (item.by === 'Tomi') tomiCount++;
                if (item.by === 'Pálma') palmaCount++;
            });

            document.getElementById('stat-tomi').innerText = tomiCount;
            document.getElementById('stat-palma').innerText = palmaCount;
        }

        // HÓNAP MODAL KEZELÉS
        function openMonthModal() {
            const modal = document.getElementById('month-modal');
            const grid = document.getElementById('month-grid-container');
            grid.innerHTML = '';
            
            // Megjelenítjük a jelenleg nézett hónap napjait (30 napot szemléltetésként)
            for (let i = 1; i <= 31; i++) {
                const dayNum = i < 10 ? '0' + i : i;
                const monthNum = (currentWeekStart.getMonth() + 1) < 10 ? '0' + (currentWeekStart.getMonth() + 1) : (currentWeekStart.getMonth() + 1);
                const dateKey = `${currentWeekStart.getFullYear()}-${monthNum}-${dayNum}`;
                const isDone = !!completedDaysData[dateKey];

                const cell = document.createElement('div');
                cell.className = `month-day-cell ${isDone ? 'done' : ''}`;
                cell.innerText = i;
                grid.appendChild(cell);
            }

            modal.style.display = 'flex';
        }

        function closeMonthModal() {
            document.getElementById('month-modal').style.display = 'none';
        }
    </script>
</body>
</html>
